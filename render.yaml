# Render Blueprint — deploys the API and its PostgreSQL database.
#
# In the Render dashboard: New -> Blueprint -> connect this repository.
# Render reads this file and creates both services. DATABASE_URL is injected
# automatically from the database below, so no secret is ever committed.
#
# Free tier notes:
#   - the web service sleeps after ~15 minutes idle; the next request wakes it
#     and takes roughly 50 seconds
#   - the free database is removed after 30 days

services:
  - type: web
    name: practice-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render supplies $PORT; binding 0.0.0.0 lets its proxy reach the app.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.3'
      - key: DATABASE_URL
        fromDatabase:
          name: practice-db
          property: connectionString

databases:
  - name: practice-db
    plan: free
    databaseName: practicedb
    user: practice
